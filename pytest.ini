[pytest]
# Add the current directory to Python path so imports work
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = 
    agents/architect/tests
    agents/supervisor/tests
    agents/coder/tests
    agents/planner/tests
    agents/reviewer/tests
    agents/tests_generator/tests
    agents/research/tests
    agents/langchain_vector_rag/tests
    agents/llama_index_vector_rag/tests
    agents/rag_middleware/tests
    core/a2a/tests

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:asyncio

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for organizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time
    asyncio: Async tests